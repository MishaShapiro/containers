global:
  scrape_interval: 10s
  evaluation_interval: 10s
rule_files: [/etc/prometheus/alerts.yml]
scrape_configs:
  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]
    metric_relabel_configs:
      - source_labels: [id]
        regex: '.*docker-([0-9a-f]{12})[0-9a-f]*\.scope'
        target_label: container_id
