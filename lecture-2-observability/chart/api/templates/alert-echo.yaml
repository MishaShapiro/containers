{{- if .Values.alertEcho.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alert-echo
spec:
  selector:
    matchLabels: { app.kubernetes.io/name: alert-echo }
  template:
    metadata:
      labels: { app.kubernetes.io/name: alert-echo }
    spec:
      containers:
        - name: echo
          image: mendhak/http-https-echo:31
          ports: [{ containerPort: 8080 }]
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits:   { cpu: 100m, memory: 128Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: alert-echo
spec:
  selector: { app.kubernetes.io/name: alert-echo }
  ports: [{ port: 8080, targetPort: 8080 }]
{{- end }}
