{{- if .Values.canary.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: api
  labels: {{- include "shop.labels" . | nindent 4 }}
  {{- if .Values.mesh.retries.enabled }}
  annotations:          # при наличии маршрута настройки retries берутся с него
    retry.linkerd.io/http: {{ .Values.mesh.retries.statuses | quote }}
    retry.linkerd.io/limit: {{ .Values.mesh.retries.limit | quote }}
    retry.linkerd.io/timeout: {{ .Values.mesh.retries.timeout | quote }}
  {{- end }}
spec:
  parentRefs:           # маршрут «прикреплён» к Service api: его применяет прокси КЛИЕНТА
    - name: api
      kind: Service
      group: core
      port: {{ .Values.api.service.port }}
  rules:
    - backendRefs:
        - name: api-v1
          port: 8080
          weight: {{ sub 100 .Values.canary.v2Weight }}
        - name: api-v2
          port: 8080
          weight: {{ .Values.canary.v2Weight }}
{{- end }}
