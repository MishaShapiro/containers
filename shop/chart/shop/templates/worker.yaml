apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  labels:
    {{- include "shop.labels" . | nindent 4 }}
    app.kubernetes.io/name: worker
spec:
  replicas: {{ .Values.worker.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: worker
      app.kubernetes.io/part-of: shop
  template:
    metadata:
      labels:
        {{- include "shop.labels" . | nindent 8 }}
        app.kubernetes.io/name: worker
    spec:
      containers:
        - name: worker
          image: "{{ .Values.worker.image.repository }}:{{ .Values.worker.image.tag }}"
          imagePullPolicy: {{ .Values.worker.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          env:
            {{- range $k, $v := .Values.worker.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
            {{- include "shop.dbEnv" . | nindent 12 }}
          readinessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 10
            periodSeconds: 10
          securityContext:
            privileged: false
            allowPrivilegeEscalation: false
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: worker
  labels:
    {{- include "shop.labels" . | nindent 4 }}
    app.kubernetes.io/name: worker
spec:
  selector:
    app.kubernetes.io/name: worker
    app.kubernetes.io/part-of: shop
  ports:
    - name: http          # только для метрик
      port: 8080
      targetPort: http
