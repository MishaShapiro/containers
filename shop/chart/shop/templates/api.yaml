{{- $root := . }}
{{- range $ver, $cfg := .Values.api.versions }}
{{- if $cfg.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-{{ $ver }}
  labels:
    {{- include "shop.labels" $root | nindent 4 }}
    app.kubernetes.io/name: api
    version: {{ $ver }}
spec:
  replicas: {{ $cfg.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  selector:
    matchLabels:
      app.kubernetes.io/name: api
      app.kubernetes.io/part-of: shop
      version: {{ $ver }}
  template:
    metadata:
      labels:
        {{- include "shop.labels" $root | nindent 8 }}
        app.kubernetes.io/name: api
        version: {{ $ver }}
      {{- if $root.Values.mesh.enabled }}
      annotations:
        linkerd.io/inject: enabled
        # у прокси должны быть requests/limits — этого требует Kyverno
        config.linkerd.io/proxy-cpu-request: {{ $root.Values.mesh.proxy.cpuRequest | quote }}
        config.linkerd.io/proxy-cpu-limit: {{ $root.Values.mesh.proxy.cpuLimit | quote }}
        config.linkerd.io/proxy-memory-request: {{ $root.Values.mesh.proxy.memoryRequest | quote }}
        config.linkerd.io/proxy-memory-limit: {{ $root.Values.mesh.proxy.memoryLimit | quote }}
      {{- end }}
    spec:
      {{- with $root.Values.api.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      {{- if eq $root.Values.api.spread.mode "topologySpread" }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway   # версий теперь несколько, жёсткое правило мешало бы на 2 нодах
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: api
              version: {{ $ver }}
          matchLabelKeys: [pod-template-hash]
      {{- end }}
      terminationGracePeriodSeconds: 30
      containers:
        - name: api
          image: "{{ $root.Values.api.image.repository }}:{{ $cfg.tag }}"
          imagePullPolicy: {{ $root.Values.api.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: VERSION
              value: {{ $ver }}
            {{- range $k, $v := $root.Values.api.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
            {{- range $k, $v := $cfg.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
            {{- include "shop.dbEnv" $root | nindent 12 }}
          readinessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 3
            failureThreshold: 2
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 15
            periodSeconds: 10
          lifecycle:
            preStop:
              exec: { command: ["sleep", "5"] }
          securityContext:
            privileged: false
            allowPrivilegeEscalation: false
          resources:
            {{- toYaml $root.Values.api.resources | nindent 12 }}
---
# Service конкретной версии — backend для HTTPRoute. Метка name=api-vX, а не api,
# чтобы ServiceMonitor не скрейпил один и тот же под дважды (через api и через api-vX)
apiVersion: v1
kind: Service
metadata:
  name: api-{{ $ver }}
  labels:
    {{- include "shop.labels" $root | nindent 4 }}
    app.kubernetes.io/name: api-{{ $ver }}
spec:
  selector:
    app.kubernetes.io/name: api
    version: {{ $ver }}
  ports:
    - name: http
      port: 8080
      targetPort: http
{{- end }}
{{- end }}
---
# Общий Service: точка входа клиентов (и parent для HTTPRoute)
apiVersion: v1
kind: Service
metadata:
  name: api
  labels:
    {{- include "shop.labels" . | nindent 4 }}
    app.kubernetes.io/name: api
  {{- if .Values.mesh.enabled }}
  annotations:
    {{- if .Values.mesh.retries.enabled }}
    retry.linkerd.io/http: {{ .Values.mesh.retries.statuses | quote }}
    retry.linkerd.io/limit: {{ .Values.mesh.retries.limit | quote }}
    retry.linkerd.io/timeout: {{ .Values.mesh.retries.timeout | quote }}
    {{- end }}
    {{- if .Values.mesh.failureAccrual.enabled }}
    balancer.linkerd.io/failure-accrual: consecutive
    balancer.linkerd.io/failure-accrual-consecutive-max-failures: {{ .Values.mesh.failureAccrual.consecutiveFailures | quote }}
    {{- end }}
  {{- end }}
spec:
  type: {{ .Values.api.service.type }}
  selector:
    app.kubernetes.io/name: api
    app.kubernetes.io/part-of: shop
  ports:
    - name: http
      port: {{ .Values.api.service.port }}
      targetPort: http
      {{- if eq .Values.api.service.type "NodePort" }}
      nodePort: {{ .Values.api.service.nodePort }}
      {{- end }}
